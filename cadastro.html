<!--PARTE DA GRAZIELLE-->

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastre-se - Barbearia do Ze</title>
    <link rel="icon" type="imagem/png" href="img/Barbearia_Logo.png"> <!--favicon-->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="estilizacoes/cadastro.css">
</head>

<body>
    <main class="container">
        <form>

            <img src="img/Barbearia_Logo.png" alt="logo" class="logo-login">

            <h1>Cadastre-se</h1>

            <!--CAMPOS DE DIGITACAO-->
            <div class="input-box">
                <input placeholder="Nome completo" type="text" required>
                <i class="bx bxs-user"></i>
            </div>

            <div class="input-box">
                <input placeholder="E-mail" type="email" required>
                <i class="bx bxs-envelope"></i>
            </div>

            <div class="input-box">
                <input placeholder="Telefone" type="tel">
                <i class="bx bxs-phone"></i>
            </div>

            <div class="input-box">
                <input placeholder="Senha" type="password" required>
                <i class="bx bxs-lock-alt"></i>
            </div>

            <div class="input-box">
                <input placeholder="Confirmar senha" type="password" required>
                <i class="bx bxs-lock-open-alt"></i>
            </div>

            <!--CONFIRMACAO, JA TEM CONTA E FUNCIONARIO-->
            <button type="submit" class="login">Criar conta</button>

            <div class="register-link">
                <p>Ja tem uma conta? <a href="login.html">Entrar</a></p>
            </div>

            <div class="funcionario">
                <a href="funcionario.html">Sou funcionario</a> <!--linkei com funcionario pra facilitar a visualizacao-->
            </div>

        </form>
    </main>
</body>
</html>
