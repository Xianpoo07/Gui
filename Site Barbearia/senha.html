<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esqueci a Senha - Barbearia do Ze</title>
    <link rel="icon" type="imagem/png" href="img/Barbearia_Logo.png">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="estilizacoes/senha.css">
</head>

<body>
    <main class="container">
        <form>

            <img src="img/Barbearia_Logo.png" alt="logo" class="logo-login">

            <h1>Esqueci a Senha</h1>

            <p class="descricao">Digite seu e-mail e enviaremos um link para redefinir sua senha.</p>

            <div class="input-box">
                <input placeholder="E-mail" type="email" required>
                <i class="bx bxs-envelope"></i>
            </div>

            <button type="submit" class="login">Enviar link</button>

            <div class="register-link">
                <p>Lembrou a senha? <a href="login.html">Voltar ao login</a></p>
            </div>

        </form>
    </main>
</body>
</html>
